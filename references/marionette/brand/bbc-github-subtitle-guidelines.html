        <h1>The BBC Subtitle Guidelines have moved!</h1>
        <p><span id="moved_to">This page has been moved to </span><a id="direct-ref" href="https://www.bbc.co.uk/accessibility/forproducts/guides/subtitles/">https://www.bbc.co.uk/accessibility/forproducts/guides/subtitles/</a></p>
        <script>
            document.write(`
            <p>You will be automatically redirected to this page in <span id="countdown">15</span> seconds.</p>
            <p>Ready to go now? You can click the link above to jump straight to the new page.</p>
            `);

            function locationPathName() {
                const dlp = document.location.pathname ?? "/";
                return dlp.startsWith('/subtitle-guidelines') ? dlp.slice(20) : '/';
            }

            function isValidPath() {
                return [
                    "/",
                    "/sample-bbctt-xsd.html",
                    "/sample-ebutt-prepared.html",
                    "/sample-ebuttd-prepared.html",
                    "/codesamples/ABCD123A02-1-preRecorded.ebuttd.xml",
                    "/codesamples/ABCD123A02-1-preRecorded.xml",
                    "/codesamples/DRIB511W02-1-preRecorded-TRIMMED.xml",
                    "/codesamples/EBU_TT-v1-0-preRecorded-ANNON.xml",
                    "/codesamples/bbctt_v1-0.xsd",
                    "/codesamples/ebu-tt-d_example.xml",
                    "/codesamples/ebu-tt-d_how-to_template.xml",
                ].includes(locationPathName())
            }

            function isDeprecatedPage() {
                return [
                    "/index_r1.html",
                ].includes(locationPathName())
            }

            function checkExists() {
                if (isDeprecatedPage()) {
                    const el = document.getElementById("moved_to");
                    el.innerHTML = (
                        "This page is no longer available and has been replaced by "
                    )
                }
                else if (!isValidPath()) {
                    const el = document.getElementById("main-content");
                    el.innerHTML = (
                        "<h1>Not Found</h1>"
                    )
                    return false;
                }

                return true;
            }

            function redirectUrl() {
                const baseUrl = "https://www.bbc.co.uk/accessibility/forproducts/guides/subtitles"
                const anchor = document.location.hash;
                let path = locationPathName();

                if (isDeprecatedPage()) {
                    path = "/";
                }

                return `${baseUrl}${path}${anchor}`;
            }


            function decrementCountDown(amount) {
                setTimeout(() => {
                    const el = document.getElementById("countdown");
                    el.innerHTML = amount ;

                    if (amount > 0) {
                        decrementCountDown(amount - 1);
                    } else {
                        window.location.href = redirectUrl();
                    }
                }, 1000);
            }

            const el = document.getElementById("direct-ref");
            const ru = redirectUrl();
            el.href = ru;
            el.innerText = ru;
            if (checkExists())
                decrementCountDown(14);
        </script>
