<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyse muscle-up</title>
<style>
  :root { --bg: #111317; --panel: #1b1e24; --line: #2c313a; --text: #e6e8eb; --dim: #8b93a1;
          --rep: #3ecf7a; --press: #f0a53a; --pull: #ef5a5a; --bar: #4fb3ff; --bone: #f5f5f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header select, header button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
  header button { cursor: pointer; }
  #state { color: var(--dim); }
  main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; flex-wrap: wrap; }
  #stage { position: relative; line-height: 0; }
  video { height: calc(100vh - 150px); max-width: 100%; background: #000; display: block; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #timeline { width: 100%; height: 28px; margin-top: 6px; cursor: pointer; display: block; }
  aside { flex: 1; min-width: 280px; max-width: 460px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card h2 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .live { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
  .live b { font-size: 18px; }
  .att { border-left: 4px solid var(--line); padding: 6px 8px; margin: 6px 0; cursor: pointer; border-radius: 4px; }
  .att:hover { background: #22262e; }
  .att.on { background: #262b35; }
  .att.rep { border-color: var(--rep); } .att.miss_press { border-color: var(--press); } .att.miss_pull { border-color: var(--pull); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 10px; background: #3a2323; color: #ffb4b4; font-size: 12px; margin: 2px 4px 0 0; }
  .ok { color: var(--rep); }
  .dim { color: var(--dim); font-size: 12px; }
  kbd { background: #2a2f38; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <button id="prev" title="Clip précédent (←)">◀</button>
  <select id="pick"></select>
  <button id="next" title="Clip suivant (→)">▶</button>
  <select id="rate" title="Vitesse">
    <option value="0.25">×0.25</option><option value="0.5">×0.5</option><option value="1" selected>×1</option>
  </select>
  <span id="state">chargement de la liste…</span>
</header>
<main>
  <div>
    <div id="stage"><video id="vid" controls muted playsinline></video><canvas id="overlay"></canvas></div>
    <canvas id="timeline"></canvas>
  </div>
  <aside>
    <div class="card"><h2>En direct</h2>
      <div class="live">
        <span>Phase</span><b id="phase">–</b>
        <span>Épaules / barre</span><b id="rise">–</b>
        <span>Angle de hanche</span><b id="hip">–</b>
        <span>Angle de genoux</span><b id="knee">–</b>
        <span>Centre de masse / barre</span><b id="com">–</b>
      </div>
      <div class="dim" style="margin-top:6px">Distances en longueurs de torse. Barre = les mains.</div>
    </div>
    <div class="card"><h2>Tentatives</h2><div id="atts" class="dim">–</div></div>
    <div class="card dim">
      <kbd>←</kbd> <kbd>→</kbd> clip · <kbd>espace</kbd> lecture · <kbd>,</kbd> <kbd>.</kbd> image par image · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> vitesse
      <div id="view"></div>
    </div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid"), ov = $("overlay"), tl = $("timeline"), ctx = ov.getContext("2d"), tctx = tl.getContext("2d");
// indices into analyze_muscleups.DRAWN: 0 nose, 1-2 ears, 3-4 shoulders, 5-6 elbows, 7-8 wrists,
// 9-10 hips, 11-12 knees, 13-14 ankles
const BONES = [[3,4],[3,5],[5,7],[4,6],[6,8],[3,9],[4,10],[9,10],[9,11],[11,13],[10,12],[12,14],[1,2]];
const LABEL = { rep: "Rep", miss_press: "Raté en poussée", miss_pull: "Raté au tirage" };
const FAULT = { swing: "balancement", hip_flexion_lost: "flexion de hanche perdue",
                weight_behind_bar: "poids derrière la barre", leg_kickback: "retour de jambe" };
const STATE = { new: "en attente", queued: "en file", fetching: "récupération sur le NAS",
                encoding: "ré-encodage", pose: "détection de pose (1-2 min)", analysis: "analyse" };
let clips = [], idx = 0, data = null, token = 0;

async function api(url) { const r = await fetch(url); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }

async function loadList() {
  try { clips = (await api("/api/clips")).clips; }
  catch (e) { $("state").textContent = "liste impossible : " + e.message; return; }
  $("pick").innerHTML = clips.map((c, i) => `<option value="${i}">${c.name.replace(/^muscleup-|\.(mp4|mov)$/g, "")}${c.state === "ready" ? " ✓" : ""}</option>`).join("");
  if (clips.length) open(0); else $("state").textContent = "aucun clip muscleup-* sur le NAS";
}

async function open(i) {
  idx = (i + clips.length) % clips.length; $("pick").value = idx;
  const my = ++token, name = clips[idx].name;
  data = null; vid.removeAttribute("src"); vid.load(); draw(); renderAttempts();
  while (my === token) {
    let j;
    try { j = await api("/api/clip?name=" + encodeURIComponent(name)); }
    catch (e) { $("state").textContent = "erreur : " + e.message; return; }
    if (my !== token) return;
    if (j.series) { data = j; break; }
    if (String(j.state).startsWith("error")) { $("state").textContent = j.state; return; }
    $("state").textContent = `${name} — ${STATE[j.state] || j.state}…`;
    await new Promise(r => setTimeout(r, 1500));
  }
  if (my !== token) return;
  clips[idx].state = "ready"; $("pick").options[idx].textContent = name.replace(/^muscleup-|\.(mp4|mov)$/g, "") + " ✓";
  const n = data.reps.length;
  $("state").textContent = `${name} — ${n} tentative${n > 1 ? "s" : ""}` + (data.view === "front" ? " — vue de face : pas de verdict" : "");
  $("view").textContent = data.view === "front" ? "Vue de face détectée : balancement, hanche, CdM et retour de jambe ne se voient pas de face." : "";
  vid.src = "/video?name=" + encodeURIComponent(name);
  vid.playbackRate = +$("rate").value;
  renderAttempts();
  if (clips.length > 1) fetch("/api/clip?name=" + encodeURIComponent(clips[(idx + 1) % clips.length].name));   // prepare the next one
}

function frameAt(t) { return data ? Math.max(0, Math.min(data.series.rise.length - 1, Math.round(t * data.fps))) : 0; }

function fit() {
  ov.width = vid.clientWidth; ov.height = vid.clientHeight;
  tl.width = tl.clientWidth; tl.height = tl.clientHeight;
}

function attemptAt(t) {
  return data && data.reps.find(r => t >= r.t_pull - 1 && t <= r.t_transition + 1.2);
}

function draw() {
  ctx.clearRect(0, 0, ov.width, ov.height);
  drawTimeline();
  if (!data || !vid.videoWidth) return;
  const f = frameAt(vid.currentTime), s = data.series;
  // the video box keeps the frame's aspect, but guard against letterboxing anyway
  const kx = ov.width / data.width, ky = ov.height / data.height, sc = Math.min(kx, ky);
  const ox = (ov.width - data.width * sc) / 2, oy = (ov.height - data.height * sc) / 2;
  const P = i => [ox + s.points[f][2 * i] * sc, oy + s.points[f][2 * i + 1] * sc];
  const [bx, by] = [ox + s.bar[f][0] * sc, oy + s.bar[f][1] * sc];
  const rise = s.rise[f], com = s.com[f], hip = s.hip[f];
  const att = attemptAt(vid.currentTime);
  // the bar plane: vertical line through the hands, blue; horizontal tick at the hands
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(79,179,255,.55)"; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, ov.height); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = "#4fb3ff"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bx - 40, by); ctx.lineTo(bx + 40, by); ctx.stroke();
  // skeleton
  ctx.strokeStyle = "rgba(245,245,245,.9)"; ctx.lineWidth = 3;
  for (const [a, b] of BONES) { const [x1, y1] = P(a), [x2, y2] = P(b); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 15; i++) { const [x, y] = P(i); ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill(); }
  // shoulders marker coloured by where they are relative to the bar
  const sh = P(3), sh2 = P(4), sx = (sh[0] + sh2[0]) / 2, sy = (sh[1] + sh2[1]) / 2;
  ctx.fillStyle = rise < 0 ? "#3ecf7a" : "#f0a53a";
  ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 7); ctx.fill();
  // centre of mass arrow: in front (green) or behind (red) the bar plane, drawn at hip height
  const hp = P(9), hp2 = P(10), hy = (hp[1] + hp2[1]) / 2;
  const facing = Math.sign((P(0)[0] - (P(1)[0] + P(2)[0]) / 2)) || 1;
  const cx = bx + facing * com * data.torso_px * sc;
  ctx.strokeStyle = ctx.fillStyle = com >= 0 ? "#3ecf7a" : "#ef5a5a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bx, hy); ctx.lineTo(cx, hy); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, hy, 7, 0, 7); ctx.fill();
  // live numbers
  $("phase").textContent = att ? (vid.currentTime < att.t_transition ? "tirage" : "après la barre") : (rise < 0 ? "au-dessus" : "–");
  $("rise").textContent = rise < 0 ? `${(-rise).toFixed(2)} au-dessus` : `${rise.toFixed(2)} sous`;
  $("hip").textContent = `${Math.round(hip)}°`;
  $("knee").textContent = `${Math.round(s.knee[f])}° (flexion ${Math.max(0, Math.round(180 - s.knee[f]))}°)`;
  $("com").textContent = com >= 0 ? `${com.toFixed(2)} devant` : `${(-com).toFixed(2)} derrière`;
  $("com").style.color = com >= 0 ? "var(--rep)" : "var(--pull)";
  // attempt banner
  if (att) {
    const col = { rep: "#3ecf7a", miss_press: "#f0a53a", miss_pull: "#ef5a5a" }[att.outcome];
    const faults = data.view === "side" ? att.faults.map(x => FAULT[x]) : [];
    const lines = [`#${att.rep} ${LABEL[att.outcome]}`, ...(faults.length ? faults : [data.view === "side" ? "aucune faute" : ""])].filter(Boolean);
    ctx.font = "bold 18px system-ui"; const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 20;
    ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(10, 10, w, 12 + lines.length * 24);
    ctx.fillStyle = col; ctx.fillText(lines[0], 20, 34);
    ctx.fillStyle = "#ffd0d0"; ctx.font = "16px system-ui";
    lines.slice(1).forEach((l, i) => ctx.fillText(l, 20, 58 + i * 24));
  }
  document.querySelectorAll(".att").forEach(el => el.classList.toggle("on", att && +el.dataset.i === att.rep - 1));
}

function drawTimeline() {
  const W = tl.width, H = tl.height;
  tctx.clearRect(0, 0, W, H);
  tctx.fillStyle = "#1b1e24"; tctx.fillRect(0, 0, W, H);
  const dur = vid.duration;
  if (!data || !dur) return;
  for (const r of data.reps) {
    tctx.fillStyle = { rep: "#3ecf7a", miss_press: "#f0a53a", miss_pull: "#ef5a5a" }[r.outcome];
    const x0 = (r.t_pull - 1) / dur * W, x1 = (r.t_transition + 1.2) / dur * W;
    tctx.fillRect(x0, 4, Math.max(4, x1 - x0), H - 8);
  }
  tctx.fillStyle = "#fff"; tctx.fillRect(vid.currentTime / dur * W - 1, 0, 2, H);
}

function renderAttempts() {
  if (!data) { $("atts").innerHTML = '<span class="dim">–</span>'; return; }
  if (!data.reps.length) { $("atts").innerHTML = '<span class="dim">Aucune tentative détectée. Barre et tête dans le cadre ? Une seule personne suivie ?</span>'; return; }
  $("atts").innerHTML = data.reps.map((r, i) => `
    <div class="att ${r.outcome}" data-i="${i}" data-t="${r.t_pull - 1}">
      <b>#${r.rep} ${LABEL[r.outcome]}</b> <span class="dim">${r.t_transition.toFixed(1)} s</span><br>
      <span class="dim">balancement ${r.swing_torso} · hanche perdue ${Math.round(r.hip_lost_deg)}° · genoux ${Math.round(r.knee_at_transition_deg)}° au passage (min ${Math.round(r.knee_min_deg)}°) · CdM ${r.com_at_transition_torso > 0 ? "+" : ""}${r.com_at_transition_torso} · retour de jambe ${r.kick_behind_bar_torso}</span><br>
      ${data.view === "side" ? (r.faults.length ? r.faults.map(x => `<span class="tag">${FAULT[x]}</span>`).join("") : '<span class="ok">aucune faute</span>') : '<span class="dim">vue de face : pas de verdict</span>'}
    </div>`).join("");
  document.querySelectorAll(".att").forEach(el => el.onclick = () => { vid.currentTime = Math.max(0, +el.dataset.t); vid.play(); });
}

let looping = false;                              // one frame loop at a time, however often play fires
function loop() {
  looping = false;
  draw();
  if (vid.paused || vid.ended) return;
  looping = true;
  if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(loop); else requestAnimationFrame(loop);
}
vid.addEventListener("loadedmetadata", () => { fit(); draw(); });
vid.addEventListener("seeked", draw);
vid.addEventListener("play", () => { if (!looping) loop(); });
new ResizeObserver(() => { fit(); draw(); }).observe(vid);
tl.addEventListener("click", e => { if (vid.duration) vid.currentTime = e.offsetX / tl.clientWidth * vid.duration; });
$("prev").onclick = () => open(idx - 1);
$("next").onclick = () => open(idx + 1);
$("pick").onchange = e => open(+e.target.value);
$("rate").onchange = e => vid.playbackRate = +e.target.value;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  const step = data ? 1 / data.fps : 1 / 30;
  if (e.key === "ArrowRight") { open(idx + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { open(idx - 1); e.preventDefault(); }
  else if (e.key === " ") { vid.paused ? vid.play() : vid.pause(); e.preventDefault(); }
  else if (e.key === ".") { vid.pause(); vid.currentTime += step; }
  else if (e.key === ",") { vid.pause(); vid.currentTime -= step; }
  else if ("123".includes(e.key)) { $("rate").value = ["0.25", "0.5", "1"]["123".indexOf(e.key)]; vid.playbackRate = +$("rate").value; }
});
fit(); loadList();
</script>
</body>
</html>
